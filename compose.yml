services:
  postgres:
    image: postgres:18
    container_name: psgr
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Укажите POSTGRES_PASSWORD в .env}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - dbnet

  adminer:
    image: adminer
    container_name: adminer
    ports:
      - "8080:8080"
    networks:
      - dbnet
    depends_on:
      - postgres

  HotelServices:
    build: .
    image: hotelservices
    container_name: hotel
    ports:
      - "${HOTEL_PORT:-8000}:8000"
    environment:
      db_url: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    networks:
      - dbnet
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy

networks:
  dbnet:
    driver: bridge

volumes:
  postgres-data:
